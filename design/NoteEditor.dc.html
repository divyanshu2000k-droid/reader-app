<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
  <style>
    body { margin: 0; background: #0B0A08; }
    * { box-sizing: border-box; }
    a { color: #F9BE3D; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; background: radial-gradient(125% 38% at 50% -6%, rgba(249,190,61,0.10), rgba(249,190,61,0.02) 46%, transparent 74%), #0B0A08; color: #F5F0E8; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden;">

  <div style="display: flex; justify-content: space-between; align-items: center; padding: 30px 22px 20px;">
    <span style="font-size: 14px; font-weight: 500; color: #8A8172;">Cancel</span>
    <div style="font-size: 15px; font-weight: 600;">New note</div>
    <span style="font-size: 14px; font-weight: 700; color: #F9BE3D;">Save</span>
  </div>

  <!-- TYPE TOGGLE -->
  <div style="padding: 0 22px 18px;">
    <div style="padding: 4px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.07); border-radius: 15px; display: flex; gap: 4px;">
      <div style="flex: 1; height: 40px; display: flex; align-items: center; justify-content: center; border-radius: 12px; background: rgba(255,255,255,0.09); font-size: 13px; font-weight: 600;">Quote</div>
      <div style="flex: 1; height: 40px; display: flex; align-items: center; justify-content: center; border-radius: 12px; font-size: 13px; font-weight: 500; color: #8A8172;">My note</div>
    </div>
  </div>

  <!-- WRITING AREA -->
  <div style="padding: 0 22px 16px;">
    <div style="min-height: 210px; padding: 18px; border-radius: 20px; background: linear-gradient(140deg, rgba(249,190,61,0.09), rgba(249,190,61,0.025)); border: 1px solid rgba(249,190,61,0.22);">
      <div style="font-size: 15.5px; line-height: 1.7; font-style: italic; color: #F0EADF;">"The best arguments in the world won't change a person's mind. The only thing that can do that is a good story."<span style="display: inline-block; width: 2px; height: 17px; background: #F9BE3D; vertical-align: text-bottom; margin-left: 2px;"></span></div>
    </div>
    <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 10px; padding: 0 4px;">
      <span style="font-size: 11px; color: #6F6759;">Saved as a draft while you type</span>
      <span style="font-size: 11px; color: #6F6759;">142</span>
    </div>
  </div>

  <!-- PAGE -->
  <div style="padding: 0 22px 14px;">
    <div style="height: 52px; border-radius: 16px; background: rgba(255,255,255,0.035); border: 1px solid rgba(255,255,255,0.07); display: flex; align-items: center; justify-content: space-between; padding: 0 17px;">
      <div style="display: flex; align-items: center; gap: 11px;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8A8172" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M6 4h12v17l-6-4.2L6 21z"/></svg>
        <span style="font-size: 14px; font-weight: 500;">Page 212</span>
      </div>
      <span style="font-size: 11.5px; color: #6F6759;">from your last session</span>
    </div>
  </div>

  <!-- CAPTURE -->
  <div style="padding: 0 22px 14px;">
    <div style="display: flex; gap: 8px;">
      <div style="flex: 1; height: 48px; border-radius: 15px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.09); display: flex; align-items: center; justify-content: center; gap: 9px; font-size: 12.5px; font-weight: 600;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#C8C0B2" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2.5"/><circle cx="8.5" cy="9.5" r="1.8"/><path d="M21 15l-5-4-6 5"/></svg>
        Scan the page
      </div>
      <div style="flex: 1; height: 48px; border-radius: 15px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.09); display: flex; align-items: center; justify-content: center; gap: 9px; font-size: 12.5px; font-weight: 600;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#C8C0B2" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 00-3 3v7a3 3 0 006 0V5a3 3 0 00-3-3z"/><path d="M19 11a7 7 0 01-14 0"/><path d="M12 18v4"/></svg>
        Dictate
      </div>
    </div>
  </div>

  <!-- PRIVACY -->
  <div style="padding: 0 22px;">
    <div style="padding: 14px 16px; border-radius: 16px; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.055); display: flex; align-items: center; gap: 12px;">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#8A8172" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;"><path d="M18 8h-1V6a5 5 0 00-10 0"/><rect x="4" y="8" width="16" height="12" rx="2.5"/></svg>
      <div style="flex: 1; min-width: 0;">
        <div style="font-size: 12.5px; font-weight: 600;">Private to you</div>
        <div style="font-size: 11px; color: #8A8172; margin-top: 2px;">Nothing here is ever posted anywhere</div>
      </div>
    </div>
  </div>

  <div style="margin-top: auto; padding: 0 22px 28px;">
    <div style="height: 56px; border-radius: 18px; background: linear-gradient(160deg, #FFD173, #F9BE3D); color: #22190A; display: flex; align-items: center; justify-content: center; font-size: 15.5px; font-weight: 700; box-shadow: 0 8px 30px rgba(249,190,61,0.32);">Save note</div>
  </div>

</div>
</x-dc>

<script data-dc-script>
class Component extends DCLogic {}
</script>
</body>
</html>

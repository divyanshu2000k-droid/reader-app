<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
  <style>
    body { margin: 0; background: #F7F8F3; }
    * { box-sizing: border-box; }
    a { color: #5B7A12; }
    a:hover { color: #445C0C; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; background: radial-gradient(115% 45% at 50% 20%, rgba(211,251,78,0.40), rgba(211,251,78,0.10) 46%, transparent 74%), #F7F8F3; color: #15170F; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden;">

  <!-- HEADER -->
  <div style="display: flex; justify-content: space-between; align-items: center; padding: 30px 22px 24px;">
    <div style="width: 40px; height: 40px; border-radius: 50%; background: #FFFFFF; border: 1px solid rgba(21,23,15,0.09); display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 6px rgba(40,48,26,0.06);">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#71766A" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>
    </div>
    <div style="font-size: 15px; font-weight: 600;">Log a session</div>
    <div style="width: 40px;"></div>
  </div>

  <!-- BOOK -->
  <div style="display: flex; gap: 13px; align-items: center; padding: 0 22px 30px;">
    <div style="width: 44px; height: 64px; border-radius: 6px; background: linear-gradient(160deg, #24503C, #14301F); flex-shrink: 0; padding: 6px 5px; box-shadow: 0 5px 14px rgba(20,48,31,0.34); display: flex; flex-direction: column; justify-content: space-between;">
      <div style="font-size: 5.5px; font-weight: 700; color: #E8DCC4; line-height: 1.15;">THE<br>OVER<br>STORY</div>
      <div style="width: 12px; height: 12px; border-radius: 50%; border: 1px solid rgba(232,220,196,0.5); align-self: flex-end;"></div>
    </div>
    <div style="min-width: 0;">
      <div style="font-size: 15px; font-weight: 600; margin-bottom: 2px;">The Overstory</div>
      <div style="font-size: 12px; color: #71766A;">Richard Powers</div>
    </div>
  </div>

  <!-- HERO READOUT -->
  <div style="text-align: center; padding: 0 22px 26px;">
    <div style="font-size: 92px; font-weight: 800; line-height: 0.86; letter-spacing: -0.05em; background: linear-gradient(165deg, #8FB81E, #46600D 78%); -webkit-background-clip: text; background-clip: text; color: transparent;">28</div>
    <div style="font-size: 12.5px; color: #71766A; margin-top: 14px; font-weight: 500;">pages this session</div>
  </div>

  <!-- QUICK ADD -->
  <div style="display: flex; gap: 8px; padding: 0 22px 26px;">
    <div style="flex: 1; height: 44px; border-radius: 14px; background: #FFFFFF; border: 1px solid rgba(21,23,15,0.09); display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600; color: #4E5348; box-shadow: 0 2px 6px rgba(40,48,26,0.04);">+10</div>
    <div style="flex: 1; height: 44px; border-radius: 14px; background: #FFFFFF; border: 1px solid rgba(21,23,15,0.09); display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600; color: #4E5348; box-shadow: 0 2px 6px rgba(40,48,26,0.04);">+25</div>
    <div style="flex: 1; height: 44px; border-radius: 14px; background: #FFFFFF; border: 1px solid rgba(21,23,15,0.09); display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600; color: #4E5348; box-shadow: 0 2px 6px rgba(40,48,26,0.04);">+50</div>
    <div style="flex: 1.3; height: 44px; border-radius: 14px; background: #FFFFFF; border: 1px solid rgba(21,23,15,0.09); display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600; color: #4E5348; box-shadow: 0 2px 6px rgba(40,48,26,0.04);">Finished</div>
  </div>

  <!-- FROM / TO -->
  <div style="display: flex; gap: 10px; padding: 0 22px 12px;">
    <div style="flex: 1;">
      <div style="font-size: 11px; color: #71766A; margin-bottom: 8px; font-weight: 500; padding-left: 2px;">From page</div>
      <div style="height: 54px; border-radius: 16px; background: #FFFFFF; border: 1px solid rgba(21,23,15,0.09); display: flex; align-items: center; padding: 0 17px; font-size: 18px; font-weight: 600; color: #9DA396;">184</div>
    </div>
    <div style="flex: 1;">
      <div style="font-size: 11px; color: #71766A; margin-bottom: 8px; font-weight: 500; padding-left: 2px;">To page</div>
      <div style="height: 54px; border-radius: 16px; background: #F6FDE3; border: 1.5px solid #7A9F1A; display: flex; align-items: center; padding: 0 17px; font-size: 18px; font-weight: 700; color: #15170F; box-shadow: 0 0 0 3px rgba(211,251,78,0.28);">212</div>
    </div>
  </div>

  <!-- WHEN -->
  <div style="padding: 0 22px 14px;">
    <div style="font-size: 11px; color: #71766A; margin-bottom: 8px; font-weight: 500; padding-left: 2px;">When</div>
    <div style="height: 54px; border-radius: 16px; background: #FFFFFF; border: 1px solid rgba(21,23,15,0.09); display: flex; align-items: center; justify-content: space-between; padding: 0 17px;">
      <span style="font-size: 14.5px; font-weight: 500;">Yesterday, 9:40 pm</span>
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#9DA396" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
    </div>
    <div style="font-size: 11.5px; color: #71766A; margin-top: 9px; padding-left: 2px; line-height: 1.5;">Any date, any time, and you can change it after saving.</div>
  </div>

  <!-- FORMAT -->
  <div style="padding: 0 22px;">
    <div style="padding: 4px; background: rgba(21,23,15,0.05); border: 1px solid rgba(21,23,15,0.07); border-radius: 15px; display: flex; gap: 4px;">
      <div style="flex: 1; height: 40px; display: flex; align-items: center; justify-content: center; border-radius: 12px; background: #FFFFFF; font-size: 13px; font-weight: 600; color: #15170F; box-shadow: 0 2px 6px rgba(40,48,26,0.09);">Pages</div>
      <div style="flex: 1; height: 40px; display: flex; align-items: center; justify-content: center; border-radius: 12px; font-size: 13px; font-weight: 500; color: #71766A;">Minutes</div>
    </div>
  </div>

  <!-- COMMIT -->
  <div style="margin-top: auto; padding: 0 22px 26px;">
    <div style="height: 56px; border-radius: 18px; background: linear-gradient(160deg, #E6FF8A, {{accent}}); color: #1A2408; display: flex; align-items: center; justify-content: center; font-size: 15.5px; font-weight: 700; box-shadow: 0 8px 24px rgba(140,180,30,0.36);">Save session</div>
    <div style="display: flex; justify-content: center; gap: 8px; margin-top: 16px;">
      <span style="font-size: 12px; color: #71766A;">Delete</span>
      <span style="font-size: 12px; color: #BFC4B8;">·</span>
      <span style="font-size: 12px; color: #71766A;">Editable anytime</span>
    </div>
  </div>

</div>
</x-dc>

<script data-dc-script data-props='{"accent":{"editor":"color","default":"#D3FB4E","options":["#D3FB4E","#F9BE3D","#FF7A45","#7FA8FF"],"section":"Theme"}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#D3FB4E' };
  }
}
</script>
</body>
</html>

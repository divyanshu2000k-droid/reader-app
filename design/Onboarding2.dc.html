<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
  <style>
    body { margin: 0; background: #0B0A08; }
    * { box-sizing: border-box; }
    a { color: #F9BE3D; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; background: radial-gradient(100% 46% at 50% 18%, rgba(249,190,61,0.16), rgba(249,190,61,0.03) 48%, transparent 76%), #0B0A08; color: #F5F0E8; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden;">

  <div style="display: flex; justify-content: flex-end; padding: 30px 22px 0;">
    <span style="font-size: 13.5px; font-weight: 600; color: #6F6759;">Skip</span>
  </div>

  <!-- ILLUSTRATION: the two ways to log -->
  <div style="padding: 40px 26px 0;">
    <div style="display: flex; gap: 12px; align-items: stretch;">
      <div style="flex: 1; padding: 20px 16px; border-radius: 20px; background: linear-gradient(150deg, rgba(249,190,61,0.16), rgba(249,190,61,0.04)); border: 1px solid rgba(249,190,61,0.28); text-align: center;">
        <div style="font-size: 30px; font-weight: 800; letter-spacing: -0.035em; line-height: 1; color: #F9BE3D; margin-bottom: 9px;">28</div>
        <div style="font-size: 10.5px; color: #C8C0B2; font-weight: 600;">pages, last night</div>
      </div>
      <div style="flex: 1; padding: 20px 16px; border-radius: 20px; background: rgba(255,255,255,0.035); border: 1px solid rgba(255,255,255,0.075); text-align: center;">
        <div style="font-size: 30px; font-weight: 800; letter-spacing: -0.035em; line-height: 1; margin-bottom: 9px;">41<span style="font-size:15px;color:#6F6759;">m</span></div>
        <div style="font-size: 10.5px; color: #8A8172; font-weight: 600;">timed, just now</div>
      </div>
    </div>
    <div style="display: flex; justify-content: center; margin-top: 16px;">
      <div style="padding: 8px 16px; border-radius: 999px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.09); font-size: 11px; color: #8A8172; font-weight: 600;">both count the same</div>
    </div>
  </div>

  <!-- COPY -->
  <div style="text-align: center; padding: 46px 32px 0;">
    <div style="font-size: 28px; font-weight: 800; letter-spacing: -0.033em; line-height: 1.15; margin-bottom: 14px;">Log it whenever<br>you remember.</div>
    <div style="font-size: 14px; color: #8A8172; line-height: 1.65;">Most apps only count reading you timed. You can start a timer here, or just tell us you read 28 pages on Tuesday. Any date, changeable later.</div>
  </div>

  <!-- NAV -->
  <div style="margin-top: auto; padding: 0 22px 30px;">
    <div style="height: 56px; border-radius: 18px; background: linear-gradient(160deg, #FFD173, #F9BE3D); color: #22190A; display: flex; align-items: center; justify-content: center; font-size: 15.5px; font-weight: 700; box-shadow: 0 8px 30px rgba(249,190,61,0.34);">Next</div>
  </div>

  <div style="display: flex; justify-content: center; gap: 6px; padding-bottom: 26px;">
    <div style="width: 5px; height: 5px; border-radius: 3px; background: rgba(255,255,255,0.16);"></div>
    <div style="width: 22px; height: 5px; border-radius: 3px; background: #F9BE3D;"></div>
    <div style="width: 5px; height: 5px; border-radius: 3px; background: rgba(255,255,255,0.16);"></div>
  </div>

</div>
</x-dc>

<script data-dc-script>
class Component extends DCLogic {}
</script>
</body>
</html>

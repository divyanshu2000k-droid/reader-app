<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
  <style>
    body { margin: 0; background: #F7F8F3; }
    * { box-sizing: border-box; }
    a { color: #5B7A12; }
    a:hover { color: #445C0C; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; background: radial-gradient(90% 40% at 50% 40%, rgba(211,251,78,0.40), rgba(211,251,78,0.11) 44%, transparent 70%), #F7F8F3; color: #15170F; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden;">

  <!-- HEADER -->
  <div style="display: flex; justify-content: space-between; align-items: center; padding: 30px 22px 0;">
    <div style="width: 40px; height: 40px; border-radius: 50%; background: #FFFFFF; border: 1px solid rgba(21,23,15,0.09); display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 6px rgba(40,48,26,0.06);">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#71766A" stroke-width="2.2" stroke-linecap="round"><path d="M18 6L6 18"/><path d="M6 6l12 12"/></svg>
    </div>
    <div style="padding: 11px 22px; border-radius: 999px; background: #FFFFFF; border: 1px solid rgba(21,23,15,0.10); font-size: 13.5px; font-weight: 600; box-shadow: 0 2px 8px rgba(40,48,26,0.07);">Finish</div>
  </div>

  <!-- BOOK LABEL -->
  <div style="text-align: center; padding: 26px 22px 0;">
    <div style="font-size: 11.5px; color: #9DA396; font-weight: 600; letter-spacing: 0.06em; margin-bottom: 5px;">READING NOW</div>
    <div style="font-size: 17px; font-weight: 600; letter-spacing: -0.015em;">The Overstory</div>
  </div>

  <!-- TIMER ORB -->
  <div style="position: relative; width: 268px; height: 268px; margin: 34px auto 0; display: flex; align-items: center; justify-content: center;">
    <div style="position: absolute; inset: 18px; border-radius: 50%; background: radial-gradient(circle at 50% 38%, #FFFFFF, #F2F5E9 78%); box-shadow: 0 10px 34px rgba(140,180,30,0.18), inset 0 1px 2px rgba(255,255,255,0.9);"></div>
    <svg width="268" height="268" viewBox="0 0 268 268" style="position: absolute; inset: 0;">
      <circle cx="134" cy="134" r="116" fill="none" stroke="rgba(21,23,15,0.09)" stroke-width="2.5"/>
      <circle cx="134" cy="134" r="116" fill="none" stroke="url(#gradB)" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="728.8" stroke-dashoffset="248" transform="rotate(-90 134 134)" style="filter: drop-shadow(0 2px 6px rgba(122,160,26,0.45));"/>
      <defs>
        <linearGradient id="gradB" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#B5E62F"/>
          <stop offset="100%" stop-color="#546F10"/>
        </linearGradient>
      </defs>
    </svg>
    <div style="position: relative; text-align: center;">
      <div style="font-size: 54px; font-weight: 700; letter-spacing: -0.035em; line-height: 1; font-variant-numeric: tabular-nums;">04:12</div>
      <div style="font-size: 11.5px; color: #71766A; margin-top: 10px; font-weight: 500;">32 pages so far</div>
    </div>
  </div>

  <!-- CONTROLS -->
  <div style="display: flex; align-items: center; justify-content: center; gap: 30px; margin-top: 40px;">
    <div style="display: flex; flex-direction: column; align-items: center; gap: 9px;">
      <div style="width: 54px; height: 54px; border-radius: 50%; background: #FFFFFF; border: 1px solid rgba(21,23,15,0.09); display: flex; align-items: center; justify-content: center; box-shadow: 0 3px 10px rgba(40,48,26,0.07);">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#4E5348" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5A2.5 2.5 0 016.5 3H19v16H6.5A2.5 2.5 0 004 21.5z"/><path d="M9 8h6"/></svg>
      </div>
      <div style="font-size: 11px; color: #71766A; font-weight: 500;">Notes</div>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 9px;">
      <div style="width: 68px; height: 68px; border-radius: 50%; background: linear-gradient(160deg, #E6FF8A, {{accent}}); display: flex; align-items: center; justify-content: center; box-shadow: 0 8px 24px rgba(140,180,30,0.42);">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="#1A2408"><rect x="7" y="5" width="3.6" height="14" rx="1.3"/><rect x="13.4" y="5" width="3.6" height="14" rx="1.3"/></svg>
      </div>
      <div style="font-size: 11px; color: #15170F; font-weight: 600;">Pause</div>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 9px;">
      <div style="width: 54px; height: 54px; border-radius: 50%; background: #FFFFFF; border: 1px solid rgba(21,23,15,0.09); display: flex; align-items: center; justify-content: center; box-shadow: 0 3px 10px rgba(40,48,26,0.07);">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#4E5348" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/></svg>
      </div>
      <div style="font-size: 11px; color: #71766A; font-weight: 500;">Highlight</div>
    </div>
  </div>

  <!-- PAGE MARKER -->
  <div style="display: flex; align-items: center; justify-content: center; gap: 7px; margin-top: 30px;">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#9DA396" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M6 4h12v17l-6-4.2L6 21z"/></svg>
    <span style="font-size: 12.5px; color: #71766A; font-weight: 500;">Page 212 · tap to adjust</span>
  </div>

  <!-- BOOK DOCK -->
  <div style="margin-top: auto; padding: 0 16px 22px;">
    <div style="display: flex; align-items: center; gap: 13px; padding: 13px 15px; border-radius: 22px; background: #FFFFFF; border: 1px solid rgba(21,23,15,0.08); box-shadow: 0 6px 20px rgba(40,48,26,0.08);">
      <div style="width: 40px; height: 58px; border-radius: 5px; background: linear-gradient(160deg, #24503C, #14301F); flex-shrink: 0; padding: 6px 5px; box-shadow: 0 4px 11px rgba(20,48,31,0.34); display: flex; flex-direction: column; justify-content: space-between;">
        <div style="font-size: 5.5px; font-weight: 700; color: #E8DCC4; line-height: 1.15;">THE<br>OVER<br>STORY</div>
        <div style="width: 11px; height: 11px; border-radius: 50%; border: 1px solid rgba(232,220,196,0.5); align-self: flex-end;"></div>
      </div>
      <div style="flex: 1; min-width: 0;">
        <div style="font-size: 13.5px; font-weight: 600; margin-bottom: 3px;">The Overstory</div>
        <div style="display: flex; align-items: center; gap: 8px;">
          <div style="flex: 1; height: 3px; background: rgba(21,23,15,0.09); border-radius: 3px; overflow: hidden;">
            <div style="height: 100%; width: 42%; background: linear-gradient(90deg, #A9D62A, #5B7A12); border-radius: 3px;"></div>
          </div>
          <div style="font-size: 10.5px; color: #71766A; font-weight: 600;">212/502</div>
        </div>
      </div>
    </div>
  </div>

</div>
</x-dc>

<script data-dc-script data-props='{"accent":{"editor":"color","default":"#D3FB4E","options":["#D3FB4E","#F9BE3D","#FF7A45","#7FA8FF"],"section":"Theme"}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#D3FB4E' };
  }
}
</script>
</body>
</html>

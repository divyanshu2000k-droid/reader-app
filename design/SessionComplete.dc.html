<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
  <style>
    body { margin: 0; background: #0B0A08; }
    * { box-sizing: border-box; }
    a { color: #F9BE3D; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; background: radial-gradient(100% 44% at 50% 14%, rgba(249,190,61,0.20), rgba(249,190,61,0.04) 46%, transparent 74%), #0B0A08; color: #F5F0E8; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden;">

  <div style="display: flex; justify-content: flex-end; padding: 26px 22px 0;">
    <div style="width: 38px; height: 38px; border-radius: 50%; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.07); display: flex; align-items: center; justify-content: center;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#B5AC9B" stroke-width="2.2" stroke-linecap="round"><path d="M18 6L6 18"/><path d="M6 6l12 12"/></svg>
    </div>
  </div>

  <!-- HEADLINE -->
  <div style="text-align: center; padding: 26px 32px 30px;">
    <div style="font-size: 12px; color: #8A8172; font-weight: 600; letter-spacing: 0.06em; margin-bottom: 12px;">SESSION SAVED</div>
    <div style="font-size: 68px; font-weight: 800; letter-spacing: -0.05em; line-height: 0.95; margin-bottom: 12px; background: linear-gradient(165deg, #FFE0A0, #F9BE3D 62%); -webkit-background-clip: text; background-clip: text; color: transparent;">41<span style="font-size: 30px;">m</span></div>
    <div style="font-size: 14px; color: #8A8172;">28 pages, 184 to 212</div>
  </div>

  <!-- EDITABLE FIELDS -->
  <div style="padding: 0 22px 14px;">
    <div style="padding: 17px 18px; border-radius: 20px; background: linear-gradient(140deg, rgba(255,255,255,0.055), rgba(255,255,255,0.02)); border: 1px solid rgba(255,255,255,0.07);">
      <div style="display: flex; align-items: center; justify-content: space-between; padding-bottom: 14px; border-bottom: 1px solid rgba(255,255,255,0.06);">
        <div>
          <div style="font-size: 11px; color: #8A8172; margin-bottom: 4px;">Finished on page</div>
          <div style="font-size: 20px; font-weight: 700;">212</div>
        </div>
        <div style="display: flex; gap: 7px;">
          <div style="width: 38px; height: 38px; border-radius: 12px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.09); display: flex; align-items: center; justify-content: center;">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#C8C0B2" stroke-width="2.6" stroke-linecap="round"><path d="M5 12h14"/></svg>
          </div>
          <div style="width: 38px; height: 38px; border-radius: 12px; background: rgba(249,190,61,0.14); border: 1px solid rgba(249,190,61,0.28); display: flex; align-items: center; justify-content: center;">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#F9BE3D" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14"/><path d="M5 12h14"/></svg>
          </div>
        </div>
      </div>
      <div style="display: flex; align-items: center; justify-content: space-between; padding-top: 14px;">
        <div>
          <div style="font-size: 11px; color: #8A8172; margin-bottom: 4px;">When</div>
          <div style="font-size: 14px; font-weight: 500;">Tonight, 9:40 pm</div>
        </div>
        <span style="font-size: 12px; color: #F9BE3D; font-weight: 600;">Change</span>
      </div>
    </div>
  </div>

  <!-- CONTEXT -->
  <div style="padding: 0 22px 14px;">
    <div style="display: flex; gap: 8px;">
      <div style="flex: 1; padding: 14px 13px; border-radius: 16px; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.055);">
        <div style="font-size: 19px; font-weight: 700; letter-spacing: -0.02em; line-height: 1; color: #F9BE3D;">13</div>
        <div style="font-size: 10.5px; color: #8A8172; margin-top: 5px; font-weight: 500;">day streak</div>
      </div>
      <div style="flex: 1; padding: 14px 13px; border-radius: 16px; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.055);">
        <div style="font-size: 19px; font-weight: 700; letter-spacing: -0.02em; line-height: 1;">42<span style="font-size: 12px; color: #6F6759;">%</span></div>
        <div style="font-size: 10.5px; color: #8A8172; margin-top: 5px; font-weight: 500;">through the book</div>
      </div>
      <div style="flex: 1; padding: 14px 13px; border-radius: 16px; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.055);">
        <div style="font-size: 19px; font-weight: 700; letter-spacing: -0.02em; line-height: 1;">~4<span style="font-size: 12px; color: #6F6759;">h</span></div>
        <div style="font-size: 10.5px; color: #8A8172; margin-top: 5px; font-weight: 500;">left to go</div>
      </div>
    </div>
  </div>

  <!-- QUICK NOTE -->
  <div style="padding: 0 22px;">
    <div style="padding: 14px 16px; border-radius: 16px; background: rgba(255,255,255,0.03); border: 1px dashed rgba(255,255,255,0.12); display: flex; align-items: center; gap: 11px;">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#6F6759" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/></svg>
      <span style="font-size: 12.5px; color: #6F6759;">Jot down a thought while it is fresh</span>
    </div>
  </div>

  <!-- ACTIONS -->
  <div style="margin-top: auto; padding: 0 22px 28px;">
    <div style="height: 56px; border-radius: 18px; background: linear-gradient(160deg, #FFD173, #F9BE3D); color: #22190A; display: flex; align-items: center; justify-content: center; font-size: 15.5px; font-weight: 700; box-shadow: 0 8px 30px rgba(249,190,61,0.34); margin-bottom: 10px;">Done</div>
    <div style="height: 50px; border-radius: 18px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.09); display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 500;">I finished the book</div>
  </div>

</div>
</x-dc>

<script data-dc-script>
class Component extends DCLogic {}
</script>
</body>
</html>
